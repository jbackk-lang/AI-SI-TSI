<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSI Demo 1.3</title><style>
:root{font:16px system-ui;color:#142f42;background:#eef3f8}
*{box-sizing:border-box}main{max-width:760px;margin:7vh auto;padding:24px}
article{background:white;border:1px solid #b9ccdb;border-radius:14px;padding:24px}
h1{margin:0 0 10px;font-size:30px}h2{font-size:19px}
nav,form{display:flex;flex-wrap:wrap;gap:9px;align-items:end}
label{display:grid;gap:4px}button,input{font:inherit;padding:9px;border-radius:7px;border:1px solid #8aa7bc}
button{background:#155e99;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #155e99;outline-offset:2px}
output{display:block;white-space:pre-line;margin-top:16px;padding:12px;background:#eef6fc;border-left:4px solid #155e99;min-height:42px}
table{width:100%;border-collapse:collapse;margin-top:14px}td,th{border-bottom:1px solid #d3e2ea;padding:8px;text-align:left}
</style><main><article><h1>TSI Demo 1.3</h1><h2>Rozmowa i pamięć</h2><p>Wybierz przykładową rozmowę. Demo odtwarza przygotowane dialogi.</p><nav>
<button data-case="def">Uzupełnij definicję</button><button data-case="integral">Sprawdź całkę</button><button data-case="uncertain">Oceń niepewność</button></nav><output id="out" aria-live="polite"></output></article></main><script>const examples={def:'Ty: Nie znam znaczenia hasła „resublimacja”.\nTSI: Jaki jest stan końcowy przemiany z gazu?\nTy: Ciało stałe.\nTSI: Zapisuję definicję: przejście z gazu do ciała stałego.',integral:'Ty: Czy dobrze policzyłem całkę z x² od 0 do 2, jeśli F(x) = x³?\nTSI: Pochodna x³ to 3x². Funkcja pierwotna to x³/3, a wynik całki wynosi 8/3.',uncertain:'Ty: Chyba tak, ale nie mam pewności.\nTSI: Zostawiam sprawę otwartą do potwierdzenia.'};for(const b of document.querySelectorAll('[data-case]'))b.onclick=()=>document.getElementById('out').textContent=examples[b.dataset.case];</script></html>
